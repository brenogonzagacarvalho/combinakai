<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C799" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7D47" />
    </linearGradient>
  </defs>
  <!-- Background with subtle squircle rounded corners for iOS style -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Stylized Coat Hanger & Diamond Star Icon -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Hanger Hook -->
    <path d="M0 -75 C-22 -75 -35 -58 -35 -40 C-35 -20 -15 -10 0 5 L0 30" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Hanger Shoulders -->
    <path d="M-115 105 L0 45 L115 105" 
          fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Hanger Crossbar -->
    <line x1="-95" y1="105" x2="95" y2="105" 
          stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
    
    <!-- Center Sparkling Star / AI Diamond -->
    <path d="M0 -15 L4 0 L18 4 L4 8 L0 22 L-4 8 L-18 4 L-4 0 Z" 
          fill="url(#goldGrad)" />
  </g>
</svg>
